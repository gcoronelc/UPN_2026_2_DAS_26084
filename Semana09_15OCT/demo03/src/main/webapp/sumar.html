<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <title>AJAX Page</title>
    </head>
    <body>
        <h1>SUMAR</h1>

        <!-- DATOS -->
        <div id="divForm">
            <form name="form1" id="form1">
                <table border="0" cellspacing="2" cellpadding="2">
                    <thead>
                        <tr>
                            <th colspan="2">DATOS</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Número 1:</td>
                            <td><input type="number" name="n1" id="n1" placeholder="20"/></td>
                        </tr>
                        <tr>
                            <td>Número 2:</td>
                            <td><input type="number" name="n2" id="n1" placeholder="30"/></td>
                        </tr>
                        <tr>
                            <td colspan="2">
                                <input type="button" value="Enviar" id="btnProcesar" name="btnProcesar" />                            
                            </td>
                        </tr>
                    </tbody>
                </table>
            </form>
        </div>

        <!-- RESULTADOS -->
        <div id="divSalida">
            <table border="0" cellspacing="2" cellpadding="2">
                <thead>
                    <tr>
                        <th colspan="2">RESULTADOS</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Número 1:</td>
                        <td><span id="sN1"></span></td>
                    </tr>
                    <tr>
                        <td>Número 2:</td>
                        <td><span id="sN2"></span></td>
                    </tr>
                    <tr>
                        <td>Suma:</td>
                        <td><span id="sSuma"></span></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>

        <script>
            // Shorthand for $( document ).ready()
            $(function () {

                console.log("La pagina esta lista!");

                $("#btnProcesar").click(fnBtnProcesar);

            });



            function fnBtnProcesar() {
                // Datos
                let n1 = $("#n1").val();
                let n2 = $("#n1").val();

                // Llama AJAX
                let datosAEnviar = {
                    "n1": n1,
                    "n2": n2
                };

                $.post("SumarController", datosAEnviar, function (respuesta) {
                    console.log('Respuesta rápida:', respuesta);
                    $("#sN1").html(respuesta.n1);
                    $("#sN2").html(respuesta.n2);
                    $("#sSuma").html(respuesta.suma);
                });

            }

        </script>


    </body>
</html>
